name: Build Electron App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Enforce 500 LOC per-file limit
        run: |
          failed=0
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "ERROR: $f has $lines lines (max 500)"
              failed=1
            fi
          done < <(find electron-app/src -name '*.ts' -o -name '*.tsx')
          if [ "$failed" -eq 1 ]; then exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
        working-directory: electron-app

      - run: npm run build:main
        working-directory: electron-app

      - run: npm run build
        working-directory: electron-app

      - run: npm test
        working-directory: electron-app

      - run: npm run make
        working-directory: electron-app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhisperApp-macOS
          path: |
            electron-app/release/*.dmg
            electron-app/release/*.zip
            electron-app/release/*.blockmap
            electron-app/release/*.yml
            electron-app/release/*.yaml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce 500 LOC per-file limit
        shell: bash
        run: |
          failed=0
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "ERROR: $f has $lines lines (max 500)"
              failed=1
            fi
          done < <(find electron-app/src -name '*.ts' -o -name '*.tsx')
          if [ "$failed" -eq 1 ]; then exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
        working-directory: electron-app

      - run: npm run build:main
        working-directory: electron-app

      - run: npm run build
        working-directory: electron-app

      - run: npm test
        working-directory: electron-app

      - run: npm run make
        working-directory: electron-app

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhisperApp-Windows
          path: |
            electron-app/release/*.exe
            electron-app/release/*.blockmap
            electron-app/release/*.yml
            electron-app/release/*.yaml

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Enforce 500 LOC per-file limit
        run: |
          failed=0
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "ERROR: $f has $lines lines (max 500)"
              failed=1
            fi
          done < <(find electron-app/src -name '*.ts' -o -name '*.tsx')
          if [ "$failed" -eq 1 ]; then exit 1; fi

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
        working-directory: electron-app

      - run: npm run build:main
        working-directory: electron-app

      - run: npm run build
        working-directory: electron-app

      - run: npm test
        working-directory: electron-app

      - run: npm run make
        working-directory: electron-app

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhisperApp-Linux
          path: |
            electron-app/release/*.AppImage
            electron-app/release/*.deb
            electron-app/release/*.rpm
            electron-app/release/*.blockmap
            electron-app/release/*.yml
            electron-app/release/*.yaml
