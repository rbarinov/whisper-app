name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (M1) runner
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build WhisperApp
        run: |
          SRC_DIR="WhisperApp/WhisperApp"
          SDK_PATH=$(xcrun --show-sdk-path)
          mkdir -p build/WhisperApp.app/Contents/MacOS
          mkdir -p build/WhisperApp.app/Contents/Resources

          SOURCES=(
            "$SRC_DIR/Models/TranscriptionEntry.swift"
            "$SRC_DIR/Models/AppSettings.swift"
            "$SRC_DIR/Services/AudioRecorder.swift"
            "$SRC_DIR/Services/HotkeyManager.swift"
            "$SRC_DIR/Services/TranscriptionService.swift"
            "$SRC_DIR/Services/PasteService.swift"
            "$SRC_DIR/ViewModels/AppState.swift"
            "$SRC_DIR/Views/MenuBarView.swift"
            "$SRC_DIR/Views/HistoryView.swift"
            "$SRC_DIR/Views/SettingsView.swift"
            "$SRC_DIR/Views/RecordingOverlayView.swift"
            "$SRC_DIR/WhisperApp.swift"
          )

          swiftc \
            -target arm64-apple-macosx13.0 \
            -sdk "$SDK_PATH" \
            -swift-version 5 \
            -O \
            -module-name WhisperApp \
            -framework AppKit \
            -framework AVFoundation \
            -framework CoreGraphics \
            -framework SwiftUI \
            -framework Carbon \
            -o build/WhisperApp.app/Contents/MacOS/WhisperApp \
            "${SOURCES[@]}"

          cp "$SRC_DIR/Info.plist" build/WhisperApp.app/Contents/Info.plist
          cp "$SRC_DIR/WhisperApp.entitlements" build/WhisperApp.app/Contents/Resources/

      - name: Ad-hoc sign
        run: |
          codesign --force --sign - \
            --entitlements WhisperApp/WhisperApp/WhisperApp.entitlements \
            build/WhisperApp.app

      - name: Verify app bundle
        run: |
          file build/WhisperApp.app/Contents/MacOS/WhisperApp
          codesign -vvv build/WhisperApp.app

      - name: Package app
        run: |
          cd build
          zip -r WhisperApp-macOS-arm64.zip WhisperApp.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperApp-macOS-arm64
          path: build/WhisperApp-macOS-arm64.zip
