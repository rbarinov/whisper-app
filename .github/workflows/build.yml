name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (M1) runner
    steps:
      - uses: actions/checkout@v4

      - name: Enforce 500 LOC per-file limit
        run: |
          failed=0
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "ERROR: $f has $lines lines (max 500)"
              failed=1
            fi
          done < <(find WhisperApp/WhisperApp -name '*.swift')
          if [ "$failed" -eq 1 ]; then exit 1; fi

      - name: Show Swift version
        run: swift --version

      - name: Build WhisperApp
        run: SKIP_SIGN=1 ./build.sh

      - name: Ad-hoc sign
        run: |
          codesign --force --sign - \
            --entitlements WhisperApp/WhisperApp/WhisperApp.entitlements \
            build/WhisperApp.app

      - name: Verify app bundle
        run: |
          file build/WhisperApp.app/Contents/MacOS/WhisperApp
          codesign -vvv build/WhisperApp.app

      - name: Package app
        run: |
          cd build
          zip -r WhisperApp-macOS-arm64.zip WhisperApp.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperApp-macOS-arm64
          path: build/WhisperApp-macOS-arm64.zip
