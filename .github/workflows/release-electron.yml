name: Release Electron App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Enforce 500 LOC per-file limit
        run: |
          failed=0
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "ERROR: $f has $lines lines (max 500)"
              failed=1
            fi
          done < <(find electron-app/src -name '*.ts' -o -name '*.tsx')
          if [ "$failed" -eq 1 ]; then exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
        working-directory: electron-app

      - name: Build native keytap addon for macOS
        working-directory: electron-app/native/keytap
        run: |
          export npm_config_target=$(node -p "require('../../node_modules/electron/package.json').version")
          echo "Building keytap for Electron $npm_config_target (${{ matrix.arch }})"
          npm install && npx node-gyp rebuild --release
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron

      - run: npm run build:main
        working-directory: electron-app

      - run: npm run build
        working-directory: electron-app

      - run: npm test
        working-directory: electron-app

      - run: npm run make -- --${{ matrix.arch }}
        working-directory: electron-app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos-${{ matrix.arch }}
          path: |
            electron-app/release/*.dmg
            electron-app/release/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce 500 LOC per-file limit
        shell: bash
        run: |
          failed=0
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "ERROR: $f has $lines lines (max 500)"
              failed=1
            fi
          done < <(find electron-app/src -name '*.ts' -o -name '*.tsx')
          if [ "$failed" -eq 1 ]; then exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
        working-directory: electron-app

      - run: npm run build:main
        working-directory: electron-app

      - run: npm run build
        working-directory: electron-app

      - run: npm test
        working-directory: electron-app

      - run: npm run make
        working-directory: electron-app

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: |
            electron-app/release/*.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Enforce 500 LOC per-file limit
        run: |
          failed=0
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "ERROR: $f has $lines lines (max 500)"
              failed=1
            fi
          done < <(find electron-app/src -name '*.ts' -o -name '*.tsx')
          if [ "$failed" -eq 1 ]; then exit 1; fi

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
        working-directory: electron-app

      - run: npm run build:main
        working-directory: electron-app

      - run: npm run build
        working-directory: electron-app

      - run: npm test
        working-directory: electron-app

      - run: npm run make
        working-directory: electron-app

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux
          path: |
            electron-app/release/*.AppImage
            electron-app/release/*.deb
            electron-app/release/*.rpm

  publish:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: electron-macos-arm64
          path: artifacts/macos-arm64

      - uses: actions/download-artifact@v4
        with:
          name: electron-macos-x64
          path: artifacts/macos-x64

      - uses: actions/download-artifact@v4
        with:
          name: electron-windows
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: electron-linux
          path: artifacts/linux

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Upload to GitHub Release
        run: |
          # Collect only distributable files (exclude yml/yaml metadata)
          mapfile -d '' FILES < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo 'No distributable files found!'
            find artifacts -type f
            exit 1
          fi
          echo 'Uploading ${#FILES[@]} files...'
          # Create release if it doesn't exist yet, or upload to existing
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" --clobber "${FILES[@]}"
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "WhisperApp $TAG" \
              --generate-notes \
              "${FILES[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
