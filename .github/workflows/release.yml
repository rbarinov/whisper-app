name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14  # Apple Silicon (M1) runner
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build WhisperApp
        run: |
          SRC_DIR="WhisperApp/WhisperApp"
          SDK_PATH=$(xcrun --show-sdk-path)
          mkdir -p build/WhisperApp.app/Contents/MacOS
          mkdir -p build/WhisperApp.app/Contents/Resources

          SOURCES=(
            "$SRC_DIR/Models/TranscriptionEntry.swift"
            "$SRC_DIR/Models/AppSettings.swift"
            "$SRC_DIR/Services/AudioRecorder.swift"
            "$SRC_DIR/Services/HotkeyManager.swift"
            "$SRC_DIR/Services/TranscriptionService.swift"
            "$SRC_DIR/Services/PasteService.swift"
            "$SRC_DIR/Services/AudioPlayerService.swift"
            "$SRC_DIR/ViewModels/AppState.swift"
            "$SRC_DIR/Views/MenuBarView.swift"
            "$SRC_DIR/Views/HistoryView.swift"
            "$SRC_DIR/Views/SettingsView.swift"
            "$SRC_DIR/Views/RecordingOverlayView.swift"
            "$SRC_DIR/WhisperApp.swift"
          )

          swiftc \
            -target arm64-apple-macosx13.0 \
            -sdk "$SDK_PATH" \
            -swift-version 5 \
            -O \
            -module-name WhisperApp \
            -framework AppKit \
            -framework AVFoundation \
            -framework CoreGraphics \
            -framework SwiftUI \
            -framework Carbon \
            -o build/WhisperApp.app/Contents/MacOS/WhisperApp \
            "${SOURCES[@]}"

          cp "$SRC_DIR/Info.plist" build/WhisperApp.app/Contents/Info.plist
          cp "$SRC_DIR/WhisperApp.entitlements" build/WhisperApp.app/Contents/Resources/

      - name: Ad-hoc sign
        run: |
          codesign --force --sign - \
            --entitlements WhisperApp/WhisperApp/WhisperApp.entitlements \
            build/WhisperApp.app

      - name: Package app
        run: |
          cd build
          zip -r WhisperApp-macOS-arm64.zip WhisperApp.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WhisperApp ${{ steps.version.outputs.version }}
          body: |
            ## Quick Install

            1. Download **WhisperApp-macOS-arm64.zip** below
            2. Extract the ZIP
            3. Move `WhisperApp.app` to `~/Applications/` (or `/Applications/`)
            4. Open the app — a microphone icon appears in the menu bar
            5. Grant **Microphone** and **Accessibility** permissions when prompted
            6. Open **Settings** from the menu bar icon and enter your API key

            > **Note**: The app is ad-hoc signed. On first launch, macOS may block it.
            > Right-click the app → **Open**, or go to **System Settings > Privacy & Security** and click **Open Anyway**.
            > For persistent permissions across updates, re-sign locally:
            > ```bash
            > codesign --force --sign "Apple Development: Your Name" ~/Applications/WhisperApp.app
            > ```
          files: build/WhisperApp-macOS-arm64.zip
          generate_release_notes: true
