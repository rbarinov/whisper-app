appId: com.whisperapp.WhisperApp
productName: WhisperApp
directories:
  buildResources: assets
  output: release
files:
  - dist/
  - assets/
  - node_modules/
  - "!node_modules/uiohook-napi/**"
  - "!node_modules/iohook-macos/**"
  - package.json
npmRebuild: false
extraResources:
  - from: native/keytap/build/Release/keytap.node
    to: native/keytap.node
    filter:
      - "**/*"
  - from: native/hotkey-helper
    to: native/hotkey-helper
    filter:
      - "**/*"
mac:
  target:
    - dmg
    - zip
  # arch is controlled by CI flags (--arm64 / --x64)
  category: public.app-category.utilities
  # entitlements auto-discovered from buildResources (assets/entitlements.mac.plist)
  artifactName: '${productName}-${version}-${arch}.${ext}'
  icon: assets/icon.icns
win:
  target:
    - nsis
    - portable
  icon: assets/icon.ico
linux:
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  category: Utility
  artifactName: '${productName}-${version}-${arch}.${ext}'
  icon: assets/icons/linux
deb:
  depends:
    - libappindicator1
