appId: com.whisperapp.WhisperApp
productName: WhisperApp
directories:
  buildResources: assets
  output: release
files:
  - dist/
  - assets/
  - node_modules/
  - "!node_modules/uiohook-napi/**"
  - "!node_modules/iohook-macos/**"
  - package.json
npmRebuild: false
extraResources:
  - from: native/keytap/build/Release/keytap.node
    to: native/keytap.node
    filter:
      - "**/*"
  - from: native/hotkey-helper
    to: native/hotkey-helper
    filter:
      - "**/*"
mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  category: public.app-category.utilities
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: assets/icon.png
win:
  target:
    - nsis
    - portable
  icon: assets/icon.png
linux:
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  category: Utility
  artifactName: '${productName}-${version}-${arch}.${ext}'
  icon: assets/icon.png
deb:
  depends:
    - libappindicator1
